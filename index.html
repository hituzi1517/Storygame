<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" id="brand" aria-label="タイトルと遊び方を開く"><span class="brand-flower" aria-hidden="true">✧</span><span><b>Ipomoea</b><small>夜明けの証言</small></span></button>
      <div class="chapter-heading"><span class="eyebrow" id="chapterNumber">CASE FILE 01</span><span id="chapterTitle">止めてほしい男</span></div>
      <div class="top-actions"><span class="save-status" id="saveStatus">この端末に自動保存</span><button class="icon-button" id="soundButton" title="BGMをオン" aria-label="BGMをオン" aria-pressed="false"></button><button class="icon-button" id="settingsButton" title="設定" aria-label="設定"></button></div>
    </header>
    <main class="game-layout">
      <section class="exploration" aria-label="探索画面">
        <div class="scene" id="scene">
          <img class="scene-bg" id="sceneImage"  alt="朝の光が差す、人物のいない植物研究室">
          <div class="scene-shade"></div><div class="film-grain" aria-hidden="true"></div>
          <div class="scene-info"><span class="eyebrow" id="sceneTime"></span><h1 id="sceneName"></h1><div class="pov" id="pov"></div></div>
          <button class="scene-help" id="labelsButton" aria-label="調べる場所のラベルを切り替え" title="調べる場所のラベルを切り替え"></button>
          <div id="hotspots" class="hotspots"></div>
          <div class="scene-caption"><span class="tiny-diamond" aria-hidden="true">◇</span><p id="sceneDescription"></p><span class="scene-counter" id="sceneCounter"></span></div>
        </div>
        <nav class="actionbar" aria-label="ゲーム操作">
          <button id="inspectButton" class="action active"></button>
          <button id="talkButton" class="action"></button>
          <button id="mapButton" class="action"></button>
          <button id="reasonButton" class="action"></button>
          <button id="notebookButton" class="action"></button>
        </nav>
        <div class="below-scene"><span id="nextAction">光の印を選んで、手がかりを調べよう。</span><button class="text-button" id="logButton">会話ログ <span aria-hidden="true">↗</span></button></div>
      </section>
      <aside class="case-rail" aria-label="事件の記録">
        <div class="rail-top"><span class="eyebrow">INVESTIGATION NOTES</span><button class="text-button" id="chapterListButton">章一覧</button></div>
        <div class="case-index" id="railNumeral">I</div>
        <p class="small-label">いま、解きたい謎</p><h2 id="caseQuestion"></h2><p class="objective" id="objective"></p>
        <div class="progress-label"><span>この章の証拠</span><b id="progressText">0 / 5</b></div><div class="progress-track"><span id="progressFill"></span></div>
        <button class="puzzle-launch" id="puzzleButton"></button>
        <div class="rail-divider"></div>
        <div class="rail-top"><span class="small-label">最近の手がかり</span><span id="totalEvidence"></span></div>
        <div id="recentClues" class="recent-clues"></div>
        <div class="companion-note"><span class="small-label" id="companionName"></span><p id="companionText"></p></div>
        <button class="hint-button" id="hintButton">行き詰まったら <span>ヒントを見る ↗</span></button>
      </aside>
    </main>
    <footer class="app-footer"><span>IPOMOEA <i>—</i> A STORY TO UNCOVER</span><span>証言を聞く。記録をつなぐ。今いる人を守る。</span></footer>
  </div>
  <dialog id="modal" aria-labelledby="modalTitle"><div class="modal-shell"><div class="modal-heading"><div><span class="eyebrow" id="modalEyebrow"></span><h2 id="modalTitle"></h2></div><button class="icon-button close-button" id="closeModal" aria-label="閉じる"></button></div><div id="modalBody"></div></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

<script>/* Ipomoea — 夜明けの証言 / ゲーム用に再構成した事件編 */
(function (root) {
const clue = (id,title,type,text,source) => ({id,title,type,text,source});
const spot = (id,label,x,y,clueId,speaker,text,extra={}) => ({id,label,x,y,clue:clueId,speaker,text,...extra});
const talk = (id,label,speaker,text,choices,clueId,extra={}) => ({id,label,speaker,text,choices,clue:clueId,...extra});
const choice = (label,reply,flag) => ({label,reply,flag});
const scene = (id,name,asset,time,description,spots,talks,pov='ニル') => ({id,name,asset,time,description,spots,talks,pov});
const clues = [
clue('e01','濡れた論文と行先','資料','カイが持っていたのは、僕の体外実験の論文だった。人体での成功は書かれていない。別の紙には現在の研究所への道順。誰かが、ここへ来るよう教えたのだ。','研究所・作業室／机'),
clue('e02','二本の導路を結ぶ線','測定','医師と何度か測定し、生来の導路の損傷部をまたぐ人工の経路を確かめた。僕が研究院に残した未公表の人体接続案に似ている。ただし、図だけでは実施者までは分からない。','研究所・作業室／測定器'),
clue('e03','沈殿した四日目の薬','試料','作りたてでは一致した反応が、時間を置くと崩れた。原料の量だけでなく工程を見直す必要がある。抽出後に不純物を分け、精製した液を処理してから混ぜる。','研究所・作業室／小瓶'),
clue('e04','カイの退出希望','証言','「治して、また働きたかった。帰りたいと言ったら、薬が要るからここにいろって」。治療への参加と、その後の追加の試験を望むことは同じではない。','研究所・診療区画／カイ'),
clue('e05','五本は診療へ、一本は分析へ','診療','六本の見本薬のうち、五本は医師が診療に残した。維持薬は人工導路への排斥・炎症を抑えるが、流れを本人の意思に合わせる薬ではない。復元後も診療は必要になる。','研究所・診療区画／担当医'),
clue('e06','植物試験の承認原本','原本','承認番号は〈植17〉。僕の署名と「対象は付属別紙による」の一文がある。署名は本物だ。何を承認した書面なのかは、別紙を含めなければ分からない。','セレド研究院／保存原本'),
clue('e07','別紙を外された写し','写し','「ニルが承認した」と添えられた写し。署名と承認番号は原本と一致しているが、対象別紙が付いていない。字が本物であることだけが、強調されている。','セレド研究院／照会書類'),
clue('e08','研究記録の引渡台帳','台帳','セレド研究院からルーヴェ薬剤研究社へ、続いてヴェルク医薬工業系列へ。利用権だけでなく、未公表案を含む記録の実物も移っている。退所時の和解は人体実施の承認ではない。','セレド研究院／記録窓口'),
clue('e09','承認番号〈植17〉の対象別紙','別紙','原本と同じ承認番号。対象欄には「体外の植物試片」。保存されていた実施記録も植物試片を扱っている。人へ使う試験をニルが承認したという根拠にはならない。','セレド研究院／記録担当'),
clue('e10','河岸の二冊の帳簿','押収記録','表の帳簿は荷物、裏の帳簿は人の仲介を記していた。研究側の調達と接する名があるが、すべてが一つの計画だと断定はできない。原紙と受渡し先を確保した。','河岸倉庫街／木箱'),
clue('e11','少年の保護記録','保護記録','倉庫の少年は別件の売買の被害者。人工導路研究の逃亡患者である証拠はない。部下に安全な寝床の手配を頼み、身体の情報は保護担当に限って扱う。','河岸倉庫街／少年'),
clue('e12','軍の委託と科学責任者','委託書','軍の検収・支出・受領番号を合わせると、委託先はヴェルク系列。計画の科学責任者としてアウレリオ・フェーンの名がある。軍側の増強への関心と、個々の指示の証明は分けて追う。','軍中央・文書窓口／検収簿'),
clue('e13','限定された治療研究の承認','承認書','初期計画には、損傷した導路を補う治療研究として限定的な承認がある。健康な人への増強、新材料への変更、無条件の継続まで承認されたわけではない。','合同照合室／計画書'),
clue('e14','本当に改善した患者','経過記録','魔力を再び使えるようになった患者は実在する。フェーンの維持薬にも技術的な成果はある。この事実を消しても、カイに起きたことは説明できない。','合同照合室／改善例'),
clue('e15','好転した日の、その先','経過記録','改善を示す表の後に、悪化した患者の長期経過と退出後の診療の記録が足りない。薬が必要だからといって、追加の試験を断れなくしてよい理由にはならない。','カイの診療先／経過照会'),
clue('e16','戻らなかったユアンの札','所持品','カイが預かる札にはユアンの名前と番号〈U04〉。「転送された」と聞いたが、本人からの便りはない。現段階では生死も移送先も確認できない。','カイの診療先／カイ'),
clue('e17','出資対象の引渡目録','控え','ディモスの保管する控えには、企業へ渡した人体応用案と付属頁の番号がある。彼が取得へ出資した証拠だが、現在の処置を指揮した証拠とは違う。','ディモス別邸／書類盆'),
clue('e18','受領されていた留保','受領記録','未公表案には「人体への長期定着と排斥は未検証」との留保がある。目録・受領確認・付属頁を合わせると、企業はこの留保を含めて受け取っていた。','ディモス別邸／受渡し確認'),
clue('e19','差は試料について動く','比較実験','同じ名前の試料AとB。器具と置き場所を入れ替えても、強い反応はBについて移った。名前や器具の誤差だけでは説明できない。処方・精製など処理条件の記録が必要だ。','材料作業所／比較台'),
clue('e20','局所で変わる通しやすさ','観察','本人が了承した追加検査で、少年の導路が局所的に通しやすさを変える様子を繰り返し観察した。姿勢と器具を替えても残る差。組織や魔力を患者へ移す発想ではない。','研究所・測定室／検査記録'),
clue('e21','一箇所に負担を集めない','検討記録','同じ系統の健全な区間へ、弱い制限を分ける余地がある。患者ごとの既損傷と症状を見て、悪化したら直前の配置へ戻す。全員に同じ配置を使える完成処置ではない。','研究所・測定室／担当医'),
clue('e22','論文の隠し場所を知る人','証言','ミレイはカイを逃がし、論文と行先を上着の内側へ入れたと言った。最初の所持品記録と一致する。彼女は社内の管理記録を持ち出したが、潜伏後の現在地までは知らない。','研究所・面会室／ミレイ'),
clue('e23','ユアンの死亡報告','原紙','患者番号〈U04〉、氏名ユアン。臨床の原紙には死亡と記されている。カイが預かった札と一致する。戻らなかった理由が、初めて記録で確かめられた。','記録照合室／臨床原紙'),
clue('e24','死亡後に転送扱いへ','管理原紙','同じ〈U04〉の管理記録が、死亡報告の後に「転送」へ訂正されている。薬剤配送の記録にも通常の転送としての裏づけがない。訂正の担当と指示元を保全する。','記録照合室／管理原紙'),
clue('e25','危険の受領と継続指示','指示書','危険報告の受領、フェーンの継続指示、その後の追加処置が文書でつながる。軍側の増強計画の決裁もある。効果があったという説明だけでは、危険を知った後の行為を正当化できない。','記録照合室／封緘文書'),
clue('e26','リゼットからの現在の回答','急使の手紙','いま患者十二人がいるのは旧第六軍人療養院。四人には変更された形成材料が使われ、消耗が進んでいる。以前の危険報告と受領控え、継続指示も添えられている。翌朝の共鳴については、まだ誰も知らない。','研究所・面会室／急使'),
clue('e27','患者と記録へ分かれる通路','現地図','搬入口から西廊下を経て患者区画へ。管理区画は途中で分かれる。温室の鉢は資材通路から外庭へ出せる。診療を止めずに原記録と身柄を確保する必要がある。','旧療養院・搬入口／現地図'),
clue('e28','新材料を使った四人','処置記録','十二人のうち四人に新しい形成材料が使われている。定着と耐久性を改善するため、処方・精製を変えたもの。変更されたのは維持薬ではない。','旧療養院・記録室／処置簿'),
clue('e29','投薬と器具を確かめる','現場確認','投薬時刻、量の記録、器具、操作に、今朝の四人の急変を説明する共通の変更は見つからない。先に基本の確認を終え、材料と環境の条件へ目を向ける。','旧療養院・患者区画／リゼット'),
clue('e30','開花と重なった急変','観測','温室の朝顔が開いた頃、新材料の四人が急に流れやすくなった。開花時の植物内の輸送は既知だが、体内材料との近距離の共鳴は初めて疑われた現象だ。','旧療養院・温室前／朝顔'),
clue('e31','昨日、初めて揃った条件','搬入記録','患者がこの棟に集約されたのは昨日の午後。新材料の患者が、同系統の開花株のこれほど近くで朝を迎えるのは初めて。以前から既知の共鳴を放置したのではない。','旧療養院・温室前／搬入票'),
clue('e32','ダリオの短い健全区間','診療図','中心に近い人工導路と広い既損傷。一箇所を強く制限すると指先の反応と痺れが悪化した。医師はその案を止めた。使える三箇所を少しずつ調整し、症状と測定を照合する。','旧療養院・患者区画／担当医')
];

 const endingName=care>=4?'声をつないだ調査':'記録をつないだ調査';
 const kai=state.flags.includes('kai_listened')?'「最初に、困ってることを聞いてくれたろ」。カイは自分の言葉で証言を残すと決めた。':state.flags.includes('kai_repaired')?'「あの時、聞き直してくれた」。急ぎすぎた問いも、引き返せたことがカイの記憶に残っていた。':'カイは、自分の経過と退出を望んだ時点を、記録に残すと決めた。';
 openModal('夜明けの、その先','CASE CLOSED · THE STORY CONTINUES',`<div class="end-ornament">✧</div><h3 class="ending-title">${endingName}</h3><p class="prose">十二人は、急性期を越えた。完治ではない。ダリオの右腕側には機能の低下が残り、薬と調節、長い診療が続く。\n\n${esc(kai)}\n\n現地の指示は、中央の発信控えと合わせられる。フェーンの継続指示、ヴァイスの軍事拡大と妨害、企業の記録管理、研究院の権利処理。それぞれの行為が、公的な追及へ引き継がれた。リゼットの通報と救助への協力も、それまでの関与を消すものではない。\n\n少年を探す問い合わせは、後から流れた押収資料の写しにたどり着く。最初から彼を送り込んだ計画など、なかった。保護と補償も続いていく。</p><div class="callout good">複数の処置を同時に行ったため、この朝だけで共鳴が完全に証明されたわけではない。分かったことも、残った問いも、次の担当へ渡した。</div><p class="prose">交代を終えて、外へ出る。\n「帰るぞ」\nアルバの声のあとに、遠くの車輪の音が重なった。僕は手帳を閉じた。まだ、帰ってからしたいことがある。</p><div class="end-stats"><div><b>${state.clues.length}/32</b><span>集めた証拠</span></div><div><b>${state.memories.length}/6</b><span>街の余白</span></div><div><b>${Object.keys(state.choices).length}</b><span>選んだ問いかけ</span></div></div><p class="body-muted">会話の選択に応じて、調査の呼び名と後の応答が変わります。事件の事実と、患者を救う結末は共通です。</p><div class="button-row split"><button class="secondary-button" id="endNotebook">手帳を読み返す</button><button class="primary-button" id="endExport">調査記録を保存 ${svg('file')}</button></div><div class="button-row"><button class="text-button" id="endReplay">最初から、別の言葉で</button></div>`,'notebook');
 $('endNotebook').onclick=()=>notebook();$('endExport').onclick=exportReport;$('endReplay').onclick=resetConfirm;
}
function title(){
 openModal('Ipomoea','AN INVESTIGATIVE STORY',`<h3 class="title-kicker">夜明けの証言</h3><p class="title-description">治してほしい、と来たのではなかった。<br>彼は、止めてほしいと言った。<br><br>残された研究と、帰れない患者。<br>二人の視点で街を巡り、<br>紙と声のあいだにある真相を探す。</p><div class="title-meta"><span>全6章の事件編</span><span>探索・会話・推理</span><span>二人の視点</span></div><div class="button-row"><button class="primary-button" id="startGame">${state.started?state.ended?'結末の記録へ':'調査を続ける':'物語を始める'} ${svg('arrow')}</button><button class="secondary-button" id="howTo">遊び方</button></div><p class="start-note">進行はこの端末に自動保存。音は、右上から任意でオンにできます。<br>原作『Ipomoea』のミステリー部分を再構成した、事件完結のゲーム版。</p>`,'title');
 $('startGame').onclick=()=>{if(!state.started){state.started=true;save();intro();}else if(state.ended)ending();else if(!state.introSeen.includes(state.chapter))intro();else{close();render();}};
 $('howTo').onclick=help;
}
function help(){
 openModal('調査の進め方','HOW TO PLAY',`<div class="topic-list">${[['search','調べる','背景の光の印を押して調査。物の記録は手帳へ入ります。'],['talk','話す','問いかけを選ぶと返事が変わります。大事な証拠は、どの選択でも取得できます。'],['map','移動','地図の場所を選んで移動。場面によりニル／アルバの視点になります。'],['link','推理','必要な記録を集めて照合パズルへ。その後、二つの証拠から結論を導きます。'],['book','手帳','証拠、会話ログ、自由メモを確認。背景の点線の印には、事件の外の小さな発見も。']].map(([i,t,b])=>`<div class="topic">${svg(i)}<span><b>${t}</b><small style="color:var(--muted);margin-top:4px">${b}</small></span></div>`).join('')}</div><div class="callout">間違えてもゲームオーバーになりません。章を進める前なら、調べ残した場所に戻れます。ヒントは「設定」または右の手帳から。Escで画面を閉じられます。</div><p class="body-muted">セーブはブラウザごとに保存されます。端末を変える時は「設定 → セーブを書き出す」でJSONを保存し、移動先で読み込んでください。ブラウザのデータを消すと、その端末の記録も消えます。</p><div class="button-row"><button class="primary-button" id="helpDone">${state.started?'調査へ戻る':'タイトルへ'}</button></div>`);
 $('helpDone').onclick=()=>state.started?close():title();
}
function settings(){
 openModal('調査の設定','SETTINGS',`<div class="settings-row"><span><p>文字を大きくする</p><small>会話と本文の文字サイズを変更</small></span><button class="toggle ${state.settings.largeText?'on':''}" id="fontToggle" aria-label="文字を大きくする" aria-pressed="${state.settings.largeText}"></button></div><div class="settings-row"><span><p>調べる場所の名前</p><small>背景のラベル表示を切り替え</small></span><button class="toggle ${state.settings.labels?'on':''}" id="labelToggle" aria-label="調べる場所の名前を表示" aria-pressed="${state.settings.labels}"></button></div><div class="settings-row"><span><p>BGM「夜明けを待つ部屋」</p><small>静かなベルと低音のオリジナル曲</small></span><button class="toggle ${audioOn?'on':''}" id="audioToggle" aria-label="BGM" aria-pressed="${audioOn}"></button></div><div class="settings-row"><label for="bgmVolume">BGM音量</label><input id="bgmVolume" type="range" min="0" max="100" value="${Math.round(audioVolume*100)}" aria-label="BGM音量" style="max-width:48%;accent-color:var(--accent)"></div><div class="settings-row"><span><p>セーブデータ</p><small>${storageOK?'この端末に自動保存中':'自動保存が使えません。書き出しを使ってください。'}${state.updatedAt?' · '+esc(new Date(state.updatedAt).toLocaleString('ja-JP')):''}</small></span></div><div class="menu-actions"><button class="secondary-button" id="exportSave">セーブを書き出す</button><button class="secondary-button" id="importSave">セーブを読み込む</button></div><div class="menu-actions"><button class="secondary-button" id="settingsHelp">遊び方</button><button class="secondary-button" id="settingsHints">ヒント</button><button class="secondary-button" id="settingsChapters">章一覧</button><button class="secondary-button" id="aboutGame">このゲームについて</button></div><div class="button-row split"><button class="text-button danger-text" id="resetGame">最初から始める</button><button class="primary-button" id="settingsDone">閉じる</button></div>`);
 $('fontToggle').onclick=()=>{state.settings.largeText=!state.settings.largeText;save();render();settings();};
 $('labelToggle').onclick=()=>{state.settings.labels=!state.settings.labels;save();render();settings();};
 $('audioToggle').onclick=async()=>{await toggleAudio();settings();};
 $('bgmVolume').oninput=e=>{audioVolume=Number(e.target.value)/100;if(audioContext&&audioOn)audioGain.gain.setTargetAtTime(audioVolume,audioContext.currentTime,.1);};
 $('exportSave').onclick=exportSave;$('importSave').onclick=()=>$('importFile').click();$('settingsHelp').onclick=help;$('settingsHints').onclick=guarded(hints);$('settingsChapters').onclick=guarded(chapterList);$('aboutGame').onclick=about;$('resetGame').onclick=resetConfirm;$('settingsDone').onclick=close;
}
function about(){
 openModal('このゲームについて','IPOMOEA · ADAPTATION',`<p class="prose">『Ipomoea 改稿版・長編小説制作バイブル』の事件を、六章の探索ゲームへ再構成しました。</p><div class="callout">原作から引き継いだもの<br>研究記録の移転、署名と対象別紙、限定承認と逸脱、ユアンの原紙、内部協力者ごとの情報の範囲、新材料と開花の仮説、患者別の救助、事件後の責任。</div><p class="body-muted">会話、章立て、手がかりの配置、書類番号〈植17〉〈U04〉、試料の比較表、調製工程の具体的な順番、模擬配置パズルの強度は、ゲーム用の再構成・補作です。原作設定への追加確定ではありません。恋愛・容姿・過去の私的な被害の詳細はこのゲームでは扱っていません。<br><br>背景五点はこのゲーム用の生成画像。人物のスチル、立ち絵、顔や姿のイラストは使っていません。地名や背景の調度はゲーム上の演出です。<br><br>会話はあらかじめ用意した選択肢で分岐します。入力内容を外部へ送信する機能はありません。全6章・32の証拠・6つの街の余白・6つの照合パズルと最後の配置パズルを収録しています。</p><div class="button-row"><button class="primary-button" id="aboutDone">設定に戻る</button></div>`);$('aboutDone').onclick=settings;
}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportSave(){save();download('ipomoea-save.json',JSON.stringify(state,null,2),'application/json');toast('セーブデータを書き出しました。');}
function exportReport(){
 let text='Ipomoea — 夜明けの証言\nあなたの調査記録\n\n';
 text+=D.chapters.map(c=>`第${c.numeral}章 ${c.title}\n${c.deduction.success}\n`).join('\n');
 text+='\n【集めた証拠】\n'+state.clues.map(id=>`${id.slice(1)} ${clue(id).title}\n${clue(id).text}\n`).join('\n');
 text+='\n【選んだ会話】\n'+D.chapters.flatMap(c=>c.scenes.flatMap(s=>s.talks)).filter(t=>Object.hasOwn(state.choices,t.id)).map(t=>`${t.speaker}／${t.label}\n選択：${t.choices[state.choices[t.id]].label}\n${t.choices[state.choices[t.id]].reply}\n`).join('\n');
 text+='\n【自由メモ】\n'+state.note+'\n\n※原作をゲーム用に再構成。書類番号・パズルの数値は補作。';
 download('ipomoea-investigation.txt',text,'text/plain;charset=utf-8');toast('調査記録を保存しました。');
}
function resetConfirm(){
 openModal('新しい調査を始める','NEW GAME',`<p class="prose">現在のセーブと自由メモを、新しい調査で置き換えます。残しておきたい場合は、先に書き出してください。</p><div class="button-row"><button class="secondary-button" id="resetCancel">戻る</button><button class="secondary-button" id="beforeResetExport">今のセーブを書き出す</button><button class="primary-button" id="confirmReset">新しい調査を始める</button></div>`);$('resetCancel').onclick=settings;$('beforeResetExport').onclick=exportSave;$('confirmReset').onclick=()=>{const oldSettings=state.settings;state=M.fresh();state.settings=oldSettings;state.started=true;save();render();intro();};
}
$('importFile').onchange=async e=>{
 const file=e.target.files[0];e.target.value='';if(!file)return;
 try{
 if(file.size>2000000)throw new Error('ファイルが大きすぎます。');const incoming=M.restore(JSON.parse(await file.text()));
 openModal('セーブを読み込む','RESTORE SAVE',`<p class="prose">第${D.chapters[incoming.chapter].numeral}章「${esc(D.chapters[incoming.chapter].title)}」\n証拠 ${incoming.clues.length} 件のデータで、現在の調査を置き換えます。</p><div class="button-row"><button class="secondary-button" id="cancelImport">戻る</button><button class="primary-button" id="confirmImport">読み込む</button></div>`);
 $('cancelImport').onclick=settings;$('confirmImport').onclick=()=>{state=incoming;save();render();close();title();toast('セーブを読み込みました。');};
 }catch(err){toast('読み込めませんでした。このゲームのセーブJSONを選んでください。');}
};
// Original 16-bar nocturne: soft bell melody, minor arpeggios and a warm bass.
let audioContext=null,audioOn=false,audioGain=null,audioTimer=null;
let musicStep=0,nextNoteTime=0,audioVolume=.35,audioBusy=false;
const musicBeat=60/72;
const musicChords=[[50,57,62,65],[46,53,58,62],[48,55,60,64],[45,52,57,61],
 [50,57,62,65],[46,53,58,62],[43,50,55,58],[45,52,57,61],
 [53,60,65,69],[48,55,60,64],[46,53,58,62],[45,52,57,61],
 [43,50,55,58],[46,53,58,62],[45,52,57,61],[50,57,62,65]];
const musicMelody=[[74,77],[76,74],[72,76],[73,null],[74,81],[77,74],[70,74],[73,null],
 [77,81],[79,76],[77,74],[73,69],[70,74],[77,76],[73,69],[74,null]];
function musicNote(midi,time,duration,level,bass=false){
 const voice=audioContext.createGain();voice.gain.setValueAtTime(0,time);
 voice.gain.linearRampToValueAtTime(level,time+(bass?.12:.018));
 voice.gain.exponentialRampToValueAtTime(.0001,time+duration);
 voice.connect(audioGain);
 const frequency=440*Math.pow(2,(midi-69)/12);
 [1,2,3].forEach((ratio,i)=>{
  const oscillator=audioContext.createOscillator(),partial=audioContext.createGain();
  oscillator.type='sine';oscillator.frequency.value=frequency*ratio;
  partial.gain.value=[1,bass?.08:.24,bass?.02:.07][i];
  oscillator.connect(partial);partial.connect(voice);
  oscillator.start(time);oscillator.stop(time+duration+.02);
  oscillator.onended=()=>{oscillator.disconnect();partial.disconnect();if(i===2)voice.disconnect();};
 });
}
function scheduleMusic(){
 if(!audioOn||document.hidden||audioContext.state!=='running')return;
 const now=audioContext.currentTime;
 if(nextNoteTime<now)nextNoteTime=now+.04;
 while(nextNoteTime<now+.22){
  const bar=Math.floor(musicStep/8)%16,step=musicStep%8,chord=musicChords[bar];
  musicNote(chord[[1,2,3,2,1,2,3,2][step]],nextNoteTime,1.9,.09);
  if(step===0)musicNote(chord[0]-12,nextNoteTime,3.3,.14,true);
  if(step===0||step===4){const note=musicMelody[bar][step/4];if(note!==null){
   musicNote(note,nextNoteTime,2.5,.16);
   musicNote(note,nextNoteTime+.27,2.7,.025);
  }}
  nextNoteTime+=musicBeat/2;musicStep=(musicStep+1)%128;
 }
}
async function toggleAudio(){
 if(audioBusy)return;audioBusy=true;
 try{
  if(!audioContext){const C=window.AudioContext||window.webkitAudioContext;if(!C)throw new Error('Audio unavailable');
   audioContext=new C();audioGain=audioContext.createGain();audioGain.gain.value=0;
   const compressor=audioContext.createDynamicsCompressor();audioGain.connect(compressor);compressor.connect(audioContext.destination);
  }
  await audioContext.resume();audioOn=!audioOn;
  audioGain.gain.setTargetAtTime(audioOn?audioVolume:0,audioContext.currentTime,.15);
  if(audioOn){nextNoteTime=audioContext.currentTime+.04;scheduleMusic();audioTimer=setInterval(scheduleMusic,100);}
  else{clearInterval(audioTimer);audioTimer=null;}
  $('soundButton').innerHTML=svg(audioOn?'sound':'mute');
  $('soundButton').setAttribute('aria-label',audioOn?'BGMをオフ':'BGMをオン');
  $('soundButton').setAttribute('aria-pressed',String(audioOn));$('soundButton').title=audioOn?'BGMをオフ':'BGMをオン';
 }catch(e){toast('このブラウザではBGMを再生できません。');}
 finally{audioBusy=false;}
}
document.addEventListener('visibilitychange',()=>{
 if(!audioContext)return;
 if(document.hidden)audioContext.suspend().catch(()=>{});
 else if(audioOn)audioContext.resume().then(scheduleMusic).catch(()=>{});
});
$('closeModal').innerHTML=svg('close');$('settingsButton').innerHTML=svg('settings');$('soundButton').innerHTML=svg('mute');$('labelsButton').innerHTML=svg('eye');
$('closeModal').onclick=close;$('modal').addEventListener('cancel',()=>{modalMode='';});
$('brand').onclick=title;$('settingsButton').onclick=settings;$('soundButton').onclick=toggleAudio;
$('inspectButton').onclick=guarded(inspectList);$('talkButton').onclick=guarded(talkList);$('mapButton').onclick=guarded(map);$('reasonButton').onclick=guarded(reason);$('notebookButton').onclick=guarded(()=>notebook());$('logButton').onclick=guarded(()=>notebook('log'));$('chapterListButton').onclick=guarded(chapterList);$('hintButton').onclick=guarded(hints);
$('labelsButton').onclick=()=>{state.settings.labels=!state.settings.labels;save();render();toast(state.settings.labels?'調べる場所の名前を表示':'名前を隠しました。光の印から調べられます。');};
$('sceneImage').onerror=()=>toast('背景を読み込めませんでした。ページを再読み込みしてください。');
render();title();
if(!storageOK)toast('自動保存を読み込めませんでした。設定からセーブを書き出せます。');
const prefetch=()=>{['archive','canal','office','sanatorium'].forEach(name=>{const i=new Image();i.src=window.IPOMOEA_BACKGROUNDS[name];});};
if('requestIdleCallback'in window)requestIdleCallback(prefetch);else setTimeout(prefetch,1000);
})();
</script>
