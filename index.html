<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102526">
  <meta name="description" content="Ipomoeaの事件を体験するミステリー・アドベンチャー。ニルとアルバの視点で街を巡り、証言と記録をつなぎ、夜明けの謎を解く。">
  <title>Ipomoea — 夜明けの証言</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="preload" as="image" href="assets/lab.webp">
  <script src="data.js" defer></script>
  <script src="model.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" id="brand" aria-label="タイトルと遊び方を開く"><span class="brand-flower" aria-hidden="true">✧</span><span><b>Ipomoea</b><small>夜明けの証言</small></span></button>
      <div class="chapter-heading"><span class="eyebrow" id="chapterNumber">CASE FILE 01</span><span id="chapterTitle">止めてほしい男</span></div>
      <div class="top-actions"><span class="save-status" id="saveStatus">この端末に自動保存</span><button class="icon-button" id="soundButton" title="環境音をオン" aria-label="環境音をオン" aria-pressed="false"></button><button class="icon-button" id="settingsButton" title="設定" aria-label="設定"></button></div>
    </header>
    <main class="game-layout">
      <section class="exploration" aria-label="探索画面">
        <div class="scene" id="scene">
          <img class="scene-bg" id="sceneImage" src="assets/lab.webp" alt="朝の光が差す、人物のいない植物研究室">
          <div class="scene-shade"></div><div class="film-grain" aria-hidden="true"></div>
          <div class="scene-info"><span class="eyebrow" id="sceneTime"></span><h1 id="sceneName"></h1><div class="pov" id="pov"></div></div>
          <button class="scene-help" id="labelsButton" aria-label="調べる場所のラベルを切り替え" title="調べる場所のラベルを切り替え"></button>
          <div id="hotspots" class="hotspots"></div>
          <div class="scene-caption"><span class="tiny-diamond" aria-hidden="true">◇</span><p id="sceneDescription"></p><span class="scene-counter" id="sceneCounter"></span></div>
        </div>
        <nav class="actionbar" aria-label="ゲーム操作">
          <button id="inspectButton" class="action active"></button>
          <button id="talkButton" class="action"></button>
          <button id="mapButton" class="action"></button>
          <button id="reasonButton" class="action"></button>
          <button id="notebookButton" class="action"></button>
        </nav>
        <div class="below-scene"><span id="nextAction">光の印を選んで、手がかりを調べよう。</span><button class="text-button" id="logButton">会話ログ <span aria-hidden="true">↗</span></button></div>
      </section>
      <aside class="case-rail" aria-label="事件の記録">
        <div class="rail-top"><span class="eyebrow">INVESTIGATION NOTES</span><button class="text-button" id="chapterListButton">章一覧</button></div>
        <div class="case-index" id="railNumeral">I</div>
        <p class="small-label">いま、解きたい謎</p><h2 id="caseQuestion"></h2><p class="objective" id="objective"></p>
        <div class="progress-label"><span>この章の証拠</span><b id="progressText">0 / 5</b></div><div class="progress-track"><span id="progressFill"></span></div>
        <button class="puzzle-launch" id="puzzleButton"></button>
        <div class="rail-divider"></div>
        <div class="rail-top"><span class="small-label">最近の手がかり</span><span id="totalEvidence"></span></div>
        <div id="recentClues" class="recent-clues"></div>
        <div class="companion-note"><span class="small-label" id="companionName"></span><p id="companionText"></p></div>
        <button class="hint-button" id="hintButton">行き詰まったら <span>ヒントを見る ↗</span></button>
      </aside>
    </main>
    <footer class="app-footer"><span>IPOMOEA <i>—</i> A STORY TO UNCOVER</span><span>証言を聞く。記録をつなぐ。今いる人を守る。</span></footer>
  </div>
  <dialog id="modal" aria-labelledby="modalTitle"><div class="modal-shell"><div class="modal-heading"><div><span class="eyebrow" id="modalEyebrow"></span><h2 id="modalTitle"></h2></div><button class="icon-button close-button" id="closeModal" aria-label="閉じる"></button></div><div id="modalBody"></div></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <noscript><div class="noscript">このゲームを遊ぶにはJavaScriptを有効にしてください。</div></noscript>
</body>
</html>
